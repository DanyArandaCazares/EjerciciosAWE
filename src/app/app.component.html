<body>
  <div class="product-container">
    <h1>Lista de productos</h1>
    <app-product-item *ngFor="let product of products"
    [product]="product"
    (showProductEvent)="getSelectedProduct($event)"
    >
  </app-product-item>
  </div>
  
  <div class="detail-container">
    <h2>Detalles del producto</h2>
  <app-product-description *ngIf="selectedProduct" [productDescription]="selectedProduct"></app-product-description>
  </div>
</body>
